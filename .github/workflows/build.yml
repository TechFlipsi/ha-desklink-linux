name: Build HA DeskLink Linux

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runtime: linux-x64
            artifact: ha-desklink-linux-x64
          - runtime: linux-arm64
            artifact: ha-desklink-linux-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: |
          dotnet publish src/HaDeskLink -c Release -r ${{ matrix.runtime }} --self-contained -o publish

      - name: Create archive
        run: |
          cp VERSION publish/
          cp ha-desklink.service publish/
          cp ha-desklink.desktop publish/
          tar czf ${{ matrix.artifact }}.tar.gz -C publish .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "VERSION=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Delete existing release if present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Deleting existing release for tag $TAG"
            gh release delete "$TAG" --yes --cleanup-tag || true
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: dist/**/*.tar.gz
          body: |
            ⚠️ **PRE-RELEASE / BETA** – Diese Version wurde noch nicht auf einem echten Linux-System getestet. Verwendung auf eigene Gefahr!

            HA DeskLink Linux v${{ steps.version.outputs.VERSION }}

            ## Installation
            ```bash
            tar xzf ha-desklink-linux-x64.tar.gz
            ./ha-desklink --setup
            sudo cp ha-desklink /usr/local/bin/
            sudo cp ha-desklink.service /etc/systemd/system/
            sudo systemctl daemon-reload
            sudo systemctl enable --now ha-desklink
            ```

            **Für ARM64 (Raspberry Pi etc.):** `ha-desklink-linux-arm64.tar.gz` verwenden.

            ## Features
            - CPU, RAM, Disk, Akku, Netzwerk-Sensoren
            - PC-Befehle (Shutdown, Restart, Lock, etc.)
            - Push-Benachrichtigungen via WebSocket
            - Auto-Update von GitHub
            - Headless Daemon (systemd)
          generate_release_notes: false
          prerelease: true

      - name: Discord Release Notification
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          curl -s -X POST -H "Content-Type: application/json" "$DISCORD_WEBHOOK" \
            -d "{\"username\":\"HA DeskLink Release\",\"embeds\":[{\"title\":\"🐧 HA DeskLink Linux v${VERSION}\",\"color\":15158332,\"description\":\"Neue Version verfügbar!\",\"fields\":[{\"name\":\"📦 Download\",\"value\":\"[GitHub Release](https://github.com/TechFlipsi/ha-desklink-linux/releases/latest)\"},{\"name\":\"💬 Discord\",\"value\":\"[Join Server](https://discord.gg/HnCZY54U7)\"}]}]}"